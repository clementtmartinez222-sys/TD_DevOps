<VirtualHost *:80>
    ProxyPreserveHost On
    ProxyPass /api/ http://simple-api:8080/
    ProxyPassReverse /api/ http://simple-api:8080/
    ProxyPass /students http://simple-api:8080/students
    ProxyPassReverse /students http://simple-api:8080/students
    ProxyPass /departments http://simple-api:8080/departments
    ProxyPassReverse /departments http://simple-api:8080/departments
    ProxyPass /actuator http://simple-api:8080/actuator
    ProxyPassReverse /actuator http://simple-api:8080/actuator
    ProxyPass / http://front:80/
    ProxyPassReverse / http://front:80/
</VirtualHost>
