---
- name: Start frontend
  community.docker.docker_container:
    name: "{{ front_container_name }}"
    image: "{{ dockerhub_username }}/tp-devops-front:{{ image_tag }}"
    docker_host: unix:///var/run/docker.sock
    state: started
    pull: true
    recreate: true
    restart_policy: unless-stopped
    networks:
      - name: "{{ docker_network_name }}"
