name: CI devops 2025

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test with Maven
        run: mvn --batch-mode clean verify

      - name: Validate SonarCloud token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --user "$SONAR_TOKEN:" \
            https://sonarcloud.io/api/authentication/validate)
          echo "SonarCloud token validation status: $status"
          test "$status" = "200"

      - name: Verify SonarCloud project
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          result=$(curl --silent --fail --user "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/projects/search?projects=clementtmartinez222-sys_TD_DevOps&organization=clemart91")
          count=$(echo "$result" | jq '.components | length')
          echo "SonarCloud projects found: $count"
          test "$count" -gt 0

      - name: Analyze with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          mvn --file ./pom.xml -B
          -Dsonar.projectKey=clementtmartinez222-sys_TD_DevOps
          -Dsonar.organization=clemart91
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token="$SONAR_TOKEN"
          -Dsonar.scanner.skipJreProvisioning=true
          clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar

  build-and-push-docker-image:
    needs: test-backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend application
        run: mvn --batch-mode clean package -DskipTests

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest

      - name: Build database image
        uses: docker/build-push-action@v6
        with:
          context: ./database
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest

      - name: Build httpd image
        uses: docker/build-push-action@v6
        with:
          context: ./httpd
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest
