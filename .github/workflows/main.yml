name: CI devops 2025

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Compile, test, and analyze the backend before building images.
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Run the clean Maven build and all available tests.
      - name: Build and test with Maven
        run: mvn --batch-mode clean verify

      # Upload the source analysis; the Quality Gate result is shown in SonarCloud.
      - name: Analyze with SonarCloud
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          mvn --file ./pom.xml -B
          -Dsonar.projectKey=clementtmartinez222-sys_TD_DevOps
          -Dsonar.organization=clemart91
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.scanner.skipJreProvisioning=true
          -Dsonar.scanner.skipSystemTruststore=true
          clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar

  # Build and publish one image for each application component.
  build-and-push-docker-image:
    needs: test-backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend application
        run: mvn --batch-mode clean package -DskipTests

      # The Docker build uses the JAR produced by Maven.
      - name: Prepare backend image context
        run: cp target/*.jar simple-api/app.jar

      # Publish images only for commits on main; other branches only build them.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest

      - name: Build database image
        uses: docker/build-push-action@v6
        with:
          context: ./database
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest

      - name: Build httpd image
        uses: docker/build-push-action@v6
        with:
          context: ./httpd
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest
